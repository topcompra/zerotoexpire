function textWidth(s,scale=1){scale=effectiveTextScale(scale);return s.length?((s.length-1)*8+glyph.cellW)*scale:0;}

function textCentered(b,s,cx,y,scale=1,c=C.text){text(b,s,cx-textWidth(s,scale)*.5,y,scale,c);}
function textInRect(b,s,r,scale=1,c=C.text){const es=effectiveTextScale(scale),h=glyph.cellH*es;textCentered(b,s,r.x+r.w*.5,r.y+(r.h-h)*.5,scale,c);}

const textProg=program(`#version 300 es\nin vec2 aPos;in vec2 aUv;in vec4 aColor;uniform vec2 uRes;out vec2 vUv;out vec4 vColor;void main(){vec2 p=aPos/uRes*2.0-1.0;gl_Position=vec4(p.x,-p.y,0,1);vUv=aUv;vColor=aColor;}`,`#version 300 es\nprecision mediump float;uniform sampler2D uTex;in vec2 vUv;in vec4 vColor;out vec4 o;void main(){float a=texture(uTex,vUv).a;o=vec4(vColor.rgb,vColor.a*a);}`);
function makeGpu(stride){const vao=gl.createVertexArray(),vbo=gl.createBuffer();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);return{vao,vbo,stride,count:0,capacityBytes:0};}
const gss=makeGpu(6),gsd=makeGpu(6),gts=makeGpu(8),gtd=makeGpu(8);

configSolid(gss);configSolid(gsd);configText(gts);configText(gtd);
function upload(g,b,usage){const v=b.view();gl.bindBuffer(gl.ARRAY_BUFFER,g.vbo);if(usage===gl.DYNAMIC_DRAW){if(v.byteLength>g.capacityBytes){let cap=Math.max(4096,g.capacityBytes||4096);while(cap<v.byteLength)cap*=2;gl.bufferData(gl.ARRAY_BUFFER,cap,usage);g.capacityBytes=cap;}if(v.byteLength)gl.bufferSubData(gl.ARRAY_BUFFER,0,v);}else{gl.bufferData(gl.ARRAY_BUFFER,v,usage);g.capacityBytes=v.byteLength;}g.count=b.n;}

// Retained candle/volume path --------------------------------------------------
// Each series lives in a compact GPU record array: [O,H,L,C,V]. The visible
// window is selected by changing the instance-buffer byte offset; candle screen
// geometry is generated in the shader, so zoom/scrub no longer rebuilds every
// wick/body on the CPU.
const candleProg=program(`#version 300 es
precision highp float;
in vec4 aOHLC;
in float aVol;
uniform vec2 uRes;
uniform vec4 uRect;
uniform float uPriceMin;
uniform float uPriceMax;
uniform float uSlots;
uniform float uVolMax;
uniform vec4 uUp;
uniform vec4 uDown;
uniform int uPass;
out vec4 vColor;
vec2 rectVertex(int id,float x0,float y0,float x1,float y1){
 if(id==0)return vec2(x0,y0);if(id==1)return vec2(x1,y0);if(id==2)return vec2(x1,y1);

}
float py(float v){float t=(v-uPriceMin)/max(0.000001,uPriceMax-uPriceMin);return uRect.y+uRect.w*(1.0-t);}

   col.a=(18.0+18.0*f)/255.0;

   if(gl_VertexID<6){
     float bw=max(1.1,step*0.55),yo=py(aOHLC.x),yc=py(aOHLC.w);if(abs(yc-yo)<1.0)yc=yo+(up?1.0:-1.0);

   }else{
     int id=gl_VertexID-6;float yh=py(aOHLC.y),yl=py(aOHLC.z);
     p=rectVertex(id,cx-0.5,min(yh,yl),cx+0.5,max(yh,yl));

 else {
   const panel=hoverPanelAt(p);
   if(panel){crosshair.active=true;crosshair.panel=panel;crosshair.x=p.x;crosshair.y=p.y;}
 }
 if(inside(p,layout.g3)){
   gesture={id:e.pointerId,x:p.x,y:p.y,axis:e.pointerType==='mouse'?'x':null};
   if(gesture.axis==='x'){dragging=true;canvas.setPointerCapture(e.pointerId);seekFromPoint(p);}
 }
});
canvas.addEventListener('pointermove',e=>{
 const p=pointerPos(e);
 if(e.pointerType==='mouse')updateMouseCrosshair(p);
 if(!gesture||gesture.id!==e.pointerId)return;
 const dx=p.x-gesture.x,dy=p.y-gesture.y;
 if(!gesture.axis&&Math.max(Math.abs(dx),Math.abs(dy))>=7){
   if(Math.abs(dy)>Math.abs(dx)){gesture.axis='y';dragging=false;return;}
   gesture.axis='x';dragging=true;try{canvas.setPointerCapture(e.pointerId);}catch{}
 }
 if(dragging&&gesture.axis==='x'){crosshair.active=true;crosshair.panel='g3';crosshair.x=p.x;crosshair.y=p.y;seekFromPoint(p);}
});
function finishPointer(e){if(gesture&&gesture.id===e.pointerId)gesture=null;dragging=false;try{canvas.releasePointerCapture(e.pointerId);}catch{}}
canvas.addEventListener('pointerup',finishPointer);
canvas.addEventListener('pointercancel',finishPointer);
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){resetCrosshair('');canvas.style.cursor='default';}});

let glyphReady=false;
function ensurePhoneReady(){
 ensureReplayReady();
 if(!glyphReady){makeGlyphAtlas();glyphReady=true;}
}
const visibilityObserver=new IntersectionObserver(entries=>{
 const visible=entries.some(entry=>entry.isIntersecting);
 if(visible===renderVisible)return;
 renderVisible=visible;
 if(renderVisible&&!rafId){ensurePhoneReady();last=performance.now();rafId=requestAnimationFrame(render);}
},{rootMargin:'180px 0px'});
visibilityObserver.observe(canvas);

// Prewarm after the browser gets its first chance to paint the surrounding page.
// If idle callbacks are unavailable, a short deferred task provides the same first-paint separation.
if('requestIdleCallback' in window)requestIdleCallback(()=>ensurePhoneReady(),{timeout:1500});
else setTimeout(()=>ensurePhoneReady(),250);


            })();
        
</script>
